palette = "noctalia"
# Minimal Starship prompt, based on ~/.p10k.zsh.
add_newline = false
command_timeout = 500
scan_timeout = 20

format = "$directory$git_branch$git_status$character"
right_format = "$status$cmd_duration$jobs$time"

[directory]
style = "bold cyan"
read_only = " ro"
read_only_style = "red"
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 1
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold green"
truncation_length = 32
truncation_symbol = ""
format = "[$branch]($style) "

[git_status]
style = "yellow"
format = "[($all_status$ahead_behind)]($style) "
conflicted = "=${count}"
ahead = "^${count}"
behind = "v${count}"
diverged = "^${ahead_count}v${behind_count}"
untracked = "?${count}"
stashed = "s${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "r${count}"
deleted = "x${count}"

[character]
format = "$symbol "
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"
vimcmd_replace_one_symbol = "[^](bold green)"
vimcmd_replace_symbol = "[^](bold green)"
vimcmd_visual_symbol = "[V](bold green)"

[status]
disabled = false
map_symbol = false
style = "red"
format = "[$status]($style) "

[cmd_duration]
min_time = 3000
style = "yellow"
format = "[$duration]($style) "

[jobs]
symbol = "&"
style = "green"
number_threshold = 2
symbol_threshold = 1
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "green"
format = "[$time]($style)"

